<!DOCTYPE html>
<html>

<head>
  <title>Sous la ville</title>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="https://unpkg.com/bootstrap/dist/css/bootstrap.min.css">

  <!-- JQuery téléchargement -->
  <script src="https://unpkg.com/jquery/dist/jquery.min.js"></script>
  <script src="https://unpkg.com/jquery-ui/dist/jquery-ui.min.js"></script>

  <!-- adapter le thème choisir :  -->
  <link rel="stylesheet" href="https://unpkg.com/jquery-ui/dist/themes/ui-darkness/jquery-ui.min.css">

  <!-- ajouter balise de style -->
  <link rel="stylesheet" href="style.css">


</head>

<body>



  <script>
    $(document).ready(function () {

      console.log('*** JQuery ' + $.fn.jquery + ' prêt ***')

      let nom = ''
      let score = 0
      let arme = 'aucune'
      let carte = false
      let blessee = false
      let amis = 2

      // Fstop
      let Fstop = function () {
        $('audio').remove()
      }


      // Fplay
      let Fplay = function (Pfile) {
        let oAudio = $('<audio autoplay><source src="' + Pfile + '"></audio>')
        $('body').append(oAudio)
      }


      // FSCENE 5 : LE NID

      let Fscene5 = function () {

        Fstop()
        Fplay('son5.wav')
        let shtml = '<div>'
        shtml += '<h3>Le nid</h3>'
        shtml += '<hr/>'
        shtml += '<center><img src="etape05.jpg" height="150"></center>'
        shtml += '<p>Vous entrez dans une galerie sombre.</p>'
        shtml += '<p>Un nid étrange bloque le passage.</p>'
        shtml += '<p>Vous entendez quelque chose bouger derrière les débris.</p>'
        shtml += '<p>Que décides-tu ?</p>'
        shtml += '</div>'

        let oBouton = {

          'Fouiller': function () {

            let sfin = '<div>'
            sfin += '<h3>Mission échouée</h3>'
            sfin += '<p>' + $('<div>').text(nom).html() + ', tu as été repéré.</p>'
            sfin += '<p>La mission est terminée.</p>'
            sfin += '<p>Score : ' + score + ' points</p>'
            sfin += '</div>'

            $(this).dialog('close').dialog('destroy').remove()

            let oFin = {
              buttons: {
                'Recommencer': function () {
                  $(this).on('dialogclose', Fscene0)
                    .dialog('close').dialog('destroy').remove()
                },
                'Fin': function () {
                  $(this).dialog('close').dialog('destroy').remove()
                }
              },
              title: 'Défaite'
            }

            $(sfin).dialog(oFin)
          },

          'Continuer sans bruit': function () {
            score += 10

            let sfin = '<div>'
            sfin += '<h3>Fin de cette partie</h3>'
            sfin += '<p>Tu as réussi à passer sans faire de bruit.</p>'
            sfin += '<p>Score : ' + score + ' points</p>'
            sfin += '</div>'

            $(this).dialog('close').dialog('destroy').remove()

            $(sfin).dialog({
              buttons: {
                'Recommencer': function () {
                  $(this).on('dialogclose', Fscene0)
                    .dialog('close').dialog('destroy').remove()
                },
                'Fin': function () {
                  $(this).dialog('close').dialog('destroy').remove()
                }
              },
              title: 'Sous la ville'
            })
          },

          'Retourner aux tunnels': function () {
            $(this).on('dialogclose', Fscene3)
              .dialog('close').dialog('destroy').remove()
          }

        }

        let oOption = {
          buttons: oBouton,
          title: 'Étape 5 - Le nid',
          width: 540,
          show: {effect: 'blind'}
        }

        $(shtml).dialog(oOption)

      } // fin Fscene5


      // SCENE 4 : LE COLLECTEUR

      let Fscene4 = function () {

        Fstop()
        Fplay('son4.wav')

        let shtml = '<div>'
        shtml += '<h3>Le collecteur</h3>'
        shtml += '<hr/>'
        shtml += '<center><img src="etape04.jpg" height="150"></center>'
        shtml += '<p>Vous arrivez dans un collecteur rempli d’eau.</p>'
        shtml += '<p>Une carte magnétique flotte près du bord.</p>'
        shtml += '<p>Cette carte pourrait ouvrir une porte plus loin.</p>'
        shtml += '<p>Que choisis-tu ?</p>'
        shtml += '</div>'

        let oBouton = {

          'Récupérer la carte': function () {
            carte = true
            score += 20

            let sfin = '<div>'
            sfin += '<h3>Carte récupérée !</h3>'
            sfin += '<p>Tu as récupéré la carte magnétique.</p>'
            sfin += '<p>Score : ' + score + ' points</p>'
            sfin += '</div>'

            $(this).dialog('close').dialog('destroy').remove()

            $(sfin).dialog({
              buttons: {
                'Retourner aux tunnels': function () {
                  $(this).on('dialogclose', Fscene3)
                    .dialog('close').dialog('destroy').remove()
                },
                'Recommencer': function () {
                  $(this).on('dialogclose', Fscene0)
                    .dialog('close').dialog('destroy').remove()
                }
              },
              title: 'Sous la ville'
            })
          },

          'Continuer sans carte': function () {

            let sfin = '<div>'
            sfin += '<h3>Tu continues sans la carte.</h3>'
            sfin += '<p>Tu devras trouver un autre moyen de progresser.</p>'
            sfin += '</div>'

            $(this).dialog('close').dialog('destroy').remove()

            $(sfin).dialog({
              buttons: {
                'Retourner aux tunnels': function () {
                  $(this).on('dialogclose', Fscene3)
                    .dialog('close').dialog('destroy').remove()
                },
                'Recommencer': function () {
                  $(this).on('dialogclose', Fscene0)
                    .dialog('close').dialog('destroy').remove()
                }
              },
              title: 'Sous la ville'
            })
          },

          'Retourner aux tunnels': function () {
            $(this).on('dialogclose', Fscene3)
              .dialog('close').dialog('destroy').remove()
          }

        }

        let oOption = {
          buttons: oBouton,
          title: 'Étape 4 - Le collecteur',
          width: 540,
          show: {effect: 'blind'}
        }

        $(shtml).dialog(oOption)

      } // fin Fscene4


      // SCENE 3 : LES TROIS TUNNELS

      let Fscene3 = function () {

        Fstop()
        Fplay('son3.wav')

        let shtml = '<div>'
        shtml += '<h3>Les trois tunnels</h3>'
        shtml += '<hr/>'
        shtml += '<center><img src="etape03.jpg" height="150"></center>'
        shtml += '<p>Trois passages s’ouvrent devant vous.</p>'
        shtml += '<p>À gauche, un tunnel inondé.</p>'
        shtml += '<p>À droite, un bruit étrange résonne.</p>'
        shtml += '<p>Quel passage choisissez-vous ?</p>'
        shtml += '</div>'

        let oBouton = {

          'Gauche': function () {
            score += 5

            $(this).on('dialogclose', Fscene4)
              .dialog('close').dialog('destroy').remove()
          },

          'Droite': function () {

            $(this).on('dialogclose', Fscene5)
              .dialog('close').dialog('destroy').remove()
          }

        }

        let oOption = {
          buttons: oBouton,
          title: 'Étape 3 - Les trois tunnels',
          width: 540,
          show: {effect: 'blind'}
        }

        $(shtml).dialog(oOption)

      } // fin Fscene3


      // SCENE 2 : LE LOCAL TECHNIQUE

      let Fscene2 = function () {

        Fstop()
        Fplay('son2.wav')

        let shtml = '<div>'
        shtml += '<h3>Le local technique</h3>'
        shtml += '<hr/>'
        shtml += '<center><img src="etape02.jpg" height="150"></center>'
        shtml += '<p>Vous découvrez un ancien local technique.</p>'
        shtml += '<p>Sur un établi, trois objets sont disponibles.</p>'
        shtml += '<p>Tu ne peux en prendre qu’un seul.</p>'
        shtml += '</div>'

        let oBouton = {

          'Prendre la machette': function () {
            arme = 'machette'
            score += 10

            $(this).on('dialogclose', Fscene3)
              .dialog('close').dialog('destroy').remove()
          },

          'Prendre la fusée': function () {
            arme = 'fusée'
            score += 10

            $(this).on('dialogclose', Fscene3)
              .dialog('close').dialog('destroy').remove()
          },

          'Prendre le pied-de-biche': function () {
            arme = 'pied-de-biche'
            score += 10

            $(this).on('dialogclose', Fscene3)
              .dialog('close').dialog('destroy').remove()
          },

          'Ne rien prendre': function () {
            arme = 'aucun objet'

            $(this).on('dialogclose', Fscene3)
              .dialog('close').dialog('destroy').remove()
          }

        }

        let oOption = {
          buttons: oBouton,
          title: 'Étape 2 - Le local technique',
          width: 540,
          show: {effect: 'blind'}
        }

        $(shtml).dialog(oOption)

      } // fin Fscene2


      // SCENE 1 : LA PLAQUE D'EGOUT

      let Fscene1 = function () {

        Fstop()
        Fplay('son0.wav')
        let shtml = '<div>'
        shtml += '<h3>La plaque d’égout</h3>'
        shtml += '<hr/>'
        shtml += '<center><img src="etape01.jpg" height="150"></center>'
        shtml += '<p>23 h 47. Léo a disparu depuis trois jours.</p>'
        shtml += '<p>Le dernier signal de son téléphone vient d’ici.</p>'
        shtml += '<p>Inès tient la lampe, Malik la corde.</p>'
        shtml += '<p>La plaque d’égout est entrouverte.</p>'
        shtml += '<p>Que décides-tu ?</p>'
        shtml += '</div>'

        let oBouton = {

          'Descendre': function () {
            score += 10

            $(this).on('dialogclose', Fscene2)
              .dialog('close').dialog('destroy').remove()
          },

          'Rentrer chez toi': function () {

            let sfin = '<div>'
            sfin += '<h3>Abandon de la mission</h3>'
            sfin += '<p>' + $('<div>').text(nom).html() + ', tu décides de rentrer chez toi.</p>'
            sfin += '<p>Léo reste introuvable.</p>'
            sfin += '<p>Score : ' + score + ' points</p>'
            sfin += '</div>'

            $(this).dialog('close').dialog('destroy').remove()

            $(sfin).dialog({
              buttons: {
                'Recommencer': function () {
                  $(this).on('dialogclose', Fscene0)
                    .dialog('close').dialog('destroy').remove()
                },
                'Fin': function () {
                  $(this).dialog('close').dialog('destroy').remove()
                }
              },
              title: 'Abandon'
            })
          }

        }

        let oOption = {
          buttons: oBouton,
          title: 'Étape 1 - La plaque d’égout',
          width: 540,
          show: {effect: 'clip'}
        }

        $(shtml).dialog(oOption)

      } // fin Fscene1


      // SCENE 0 : PRENOM DU JOUEUR

      let Fscene0 = function () {

        Fstop()
  
        let shtml = '<div>'
        shtml += '<h3>Bienvenue dans Sous la ville !</h3>'
        shtml += '<hr/>'
        shtml += '<center><img src="égout.jpg" height="150"></center>'
        shtml += '<p>Léo a disparu sous la ville.</p>'
        shtml += '<p>Entre ton prénom pour commencer :</p>'
        shtml += '<input type="text" id="idNom" placeholder="Ton prénom">'
        shtml += '<p id="idErreur" style="color:red"></p>'
        shtml += '</div>'

        let oBouton = {

          'Commencer': function () {

            nom = $('#idNom').val().trim()

            if (nom == '') {
              $('#idErreur').text('Entre ton prénom !')
            }
            else {

              score = 0
              arme = 'aucune'
              carte = false
              blessee = false
              amis = 2

              $(this).on('dialogclose', Fscene1)
                .dialog('close').dialog('destroy').remove()
            }

          }

        }

        let oOption = {
          buttons: oBouton,
          title: 'Sous la ville',
          width: 540,
          modal: true,
          show: {effect: 'blind'}
        }

        $(shtml).dialog(oOption)

      } // fin Fscene0


    

      Fscene0()

    })

  </script>

</body>

</html>
